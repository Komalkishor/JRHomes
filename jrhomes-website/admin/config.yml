backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery"
    files:
      - file: "content/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}} — {{fields.suburb}}"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Job type / description", name: "caption", widget: "string", required: false, hint: "e.g. Full exterior repaint"}
              - {label: "Suburb", name: "suburb", widget: "string", required: false, hint: "e.g. Cronulla"}
              - {label: "Feature on homepage (top rotating photos)", name: "featured", widget: "boolean", default: false}
